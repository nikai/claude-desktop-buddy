; M5Unified is used for both targets — same source compiles for both boards.
; Differences live in build_flags (BUDDY_HAS_LED for StickC Plus's GPIO 10
; indicator LED, which StickS3 doesn't have).

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5Unified
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:m5stickc-plus]
board = m5stick-c
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBUDDY_HAS_LED=1

[env:m5sticks3]
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
board_build.partitions = default_8MB.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_M5STACK_STICKS3
