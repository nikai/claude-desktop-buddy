; M5Unified is used for both targets — same source compiles for both boards.
; Differences live in build_flags (BUDDY_HAS_LED for StickC Plus's GPIO 10
; indicator LED, which StickS3 doesn't have).

; This fork's primary target is StickS3 (the original upstream env stays
; available for anyone with M5StickC Plus hardware). Setting default_envs
; here is a safety guard: bare `pio run -t upload` would otherwise iterate
; every env and try to flash StickC Plus firmware over a connected StickS3
; (or vice-versa), which can brick a session.
[platformio]
default_envs = m5sticks3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5Unified
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:m5stickc-plus]
board = m5stick-c
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBUDDY_HAS_LED=1

[env:m5sticks3]
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
; Custom no-OTA layout that keeps the LittleFS data slot generous enough
; for upstream character packs (~1.8MB ceiling enforced in xfer.h). The
; stock default_8MB.csv would cap LittleFS at ~1.5MB and reject larger
; legal packs in char_begin.
board_build.partitions = no_ota_8MB.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_M5STACK_STICKS3
    -DBUDDY_HAS_HITACHI_AC=1
; HITACHI AC IR is StickS3-only — GPIO46 IR TX doesn't exist on StickC
; Plus (ESP32-PICO max GPIO 39). Keep IRremoteESP8266 out of the shared
; [env] lib_deps so StickC Plus builds stay byte-identical to before.
;
; We use the library's HITACHI protocol encoder to synthesize frames
; directly — no recording. The StickS3's claimed internal IR receiver
; (GPIO42) doesn't appear to be a usable demodulated TSOP path in
; practice (RX pin floods with RFI/floating noise even when physically
; covered), so the receive-and-replay approach was abandoned for the
; deterministic library-encoded approach.
lib_deps =
    ${env.lib_deps}
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
